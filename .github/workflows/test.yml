# Runs the harness on every pull request and push to main, so a red check
# blocks the merge button. It needs only Node.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check worker.js && node --check public/widget.js
      - name: The knowledge bundle is in step with the markdown
        run: |
          cp data/knowledge.json /tmp/before.json
          node scripts/bundle-knowledge.mjs
          node -e "
            const a = JSON.parse(require('fs').readFileSync('/tmp/before.json','utf8')).docs;
            const b = JSON.parse(require('fs').readFileSync('data/knowledge.json','utf8')).docs;
            if (JSON.stringify(a) !== JSON.stringify(b)) { console.error('data/knowledge.json is stale: run npm run build and commit it'); process.exit(1); }
          "
      - name: Harness
        run: node tools/chattest.mjs
